name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:editor
      - run: npm run typecheck
      - run: npm run check:versions
      - run: npm test
  native-local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Compile Android native model engine
        shell: bash
        run: |
          set -euo pipefail
          cmake="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          ninja="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          toolchain="$ANDROID_HOME/ndk/27.1.12297006/build/cmake/android.toolchain.cmake"
          for abi in arm64-v8a armeabi-v7a; do
            "$cmake" -S android/app/src/main/cpp -B "$RUNNER_TEMP/agentlink-$abi" -G Ninja -DCMAKE_MAKE_PROGRAM="$ninja" -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release
            "$cmake" --build "$RUNNER_TEMP/agentlink-$abi" --target agentlink_local --parallel 2
          done
